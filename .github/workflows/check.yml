# Check site/: local links resolve inside site/ (tools/check_site.py).
name: check

# Runs once per PR, as the final check before merge (Actions minutes): PRs stay drafts while in development and
# review, and this fires when one is marked ready. Re-run by hand with `gh workflow run check --ref <branch>`.
on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_site.py
