# Check site/: local links resolve inside site/ (tools/check_site.py).
name: check

# Manual only (Actions minutes): run once per PR, just before merge, with `gh workflow run check --ref <branch>`.
on:
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_site.py
