# Check site/: local links resolve inside site/ (tools/check_site.py).
name: check

# Cheap, so it runs on every push (Run workflow re-runs it by hand).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_site.py
