<script>
const player = document.getElementById("player");
const links = [...document.querySelectorAll(".tracks a")];
let current = -1;
function play(i) {
  links[current]?.removeAttribute("aria-current");
  current = i;
  links[i].setAttribute("aria-current", "true");
  player.src = links[i].href;
  player.play();
}
links.forEach((a, i) => a.addEventListener("click", e => { e.preventDefault(); play(i); }));
player.addEventListener("ended", () => { if (current + 1 < links.length) play(current + 1); });
</script>
